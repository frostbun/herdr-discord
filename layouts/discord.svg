<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220">
  <rect width="360" height="220" fill="#313338"/>

  <!-- guild rail -->
  <rect x="0" y="0" width="44" height="220" fill="#1e1f22"/>
  <rect x="0" y="16" width="3" height="20" rx="1.5" fill="#f2f3f5"/>
  <circle cx="22" cy="26" r="14" fill="#5865f2"/>
  <circle cx="22" cy="60" r="14" fill="#313338"/>
  <rect x="15" y="53" width="14" height="14" rx="3" fill="#4e5058"/>
  <circle cx="33" cy="51" r="3" fill="#f23f43"/>
  <circle cx="22" cy="94" r="14" fill="#313338"/>
  <rect x="15" y="87" width="14" height="14" rx="3" fill="#4e5058"/>
  <circle cx="22" cy="200" r="14" fill="#313338"/>
  <path d="M22 193v14M15 200h14" stroke="#23a55a" stroke-width="2"/>

  <!-- channel list -->
  <rect x="44" y="0" width="106" height="220" fill="#2b2d31"/>
  <rect x="44" y="0" width="1" height="220" fill="#1e1f22"/>
  <rect x="54" y="12" width="10" height="10" rx="2" fill="#949ba4"/>
  <rect x="70" y="13" width="46" height="8" rx="4" fill="#f2f3f5"/>
  <rect x="54" y="30" width="52" height="3" rx="1.5" fill="#6d6f78"/>
  <text x="56" y="56" font-family="sans-serif" font-size="6" fill="#949ba4">TEXT CHANNELS</text>
  <text x="120" y="56" font-family="sans-serif" font-size="8" fill="#949ba4">+</text>
  <rect x="50" y="62" width="94" height="16" rx="4" fill="#404249"/>
  <text x="56" y="73" font-family="sans-serif" font-size="9" fill="#f2f3f5">#</text>
  <rect x="65" y="66" width="36" height="7" rx="3.5" fill="#dbdee1"/>
  <!-- the open channel's threads, on the guide line -->
  <g stroke="#dbdee1" stroke-opacity="0.55" stroke-width="1.4" fill="none">
    <path d="M58 78v16M58 94h5"/>
    <path d="M58 94v8a4 4 0 0 0 4 4h1"/>
  </g>
  <rect x="68" y="83" width="42" height="12" rx="3" fill="#383a40"/>
  <rect x="72" y="87" width="26" height="4" rx="2" fill="#dbdee1"/>
  <rect x="68" y="99" width="50" height="12" rx="3" fill="#383a40"/>
  <rect x="72" y="103" width="32" height="4" rx="2" fill="#dbdee1"/>

  <text x="56" y="130" font-family="sans-serif" font-size="6" fill="#949ba4">VOICE CHANNELS</text>
  <circle cx="60" cy="144" r="6" fill="#404249"/>
  <rect x="72" y="141" width="30" height="7" rx="3.5" fill="#dbdee1"/>
  <circle cx="100" cy="144" r="2" fill="#23a55a"/>

  <!-- user card -->
  <rect x="44" y="182" width="106" height="38" fill="#232428"/>
  <rect x="44" y="182" width="106" height="1" fill="#1e1f22"/>
  <rect x="53" y="193" width="16" height="16" rx="4" fill="#5865f2"/>
  <circle cx="66" cy="206" r="4" fill="#232428"/>
  <circle cx="66" cy="206" r="2.5" fill="#23a55a"/>
  <rect x="76" y="193" width="30" height="7" rx="3.5" fill="#f2f3f5"/>
  <rect x="76" y="203" width="42" height="5" rx="2.5" fill="#80848e"/>
  <circle cx="136" cy="201" r="5" fill="none" stroke="#6d6f78" stroke-width="1.4"/>

  <!-- channel header -->
  <rect x="150" y="0" width="134" height="34" fill="#313338"/>
  <rect x="150" y="33" width="134" height="1" fill="#1e1f22"/>
  <text x="160" y="23" font-family="sans-serif" font-size="14" fill="#6d6f78">#</text>
  <rect x="174" y="10" width="34" height="9" rx="4.5" fill="#f2f3f5"/>
  <rect x="213" y="12" width="1" height="8" fill="#3f4147"/>
  <rect x="219" y="12" width="28" height="6" rx="3" fill="#949ba4"/>
  <rect x="258" y="8" width="20" height="12" rx="4" fill="#404249"/>
  <text x="262" y="17" font-family="sans-serif" font-size="7" fill="#949ba4">3</text>
  <circle cx="280" cy="14" r="5" fill="none" stroke="#6d6f78" stroke-width="1.3"/>

  <!-- threads: two panes -->
  <rect x="150" y="54" width="64" height="166" fill="#313338"/>
  <rect x="155" y="70" width="44" height="5" rx="2.5" fill="#23a55a"/>
  <rect x="155" y="80" width="30" height="4" rx="2" fill="#80848e"/>
  <rect x="155" y="90" width="48" height="4" rx="2" fill="#4e5058"/>
  <rect x="155" y="98" width="26" height="4" rx="2" fill="#4e5058"/>
  <text x="155" y="114" font-family="monospace" font-size="5.5" fill="#b5bac1">$ omp</text>

  <rect x="218" y="54" width="66" height="166" fill="#313338"/>
  <rect x="223" y="70" width="40" height="4" rx="2" fill="#80848e"/>
  <rect x="223" y="78" width="26" height="4" rx="2" fill="#4e5058"/>
  <text x="223" y="94" font-family="monospace" font-size="5.5" fill="#b5bac1">$ git log</text>

  <!-- side column: Files | Changes -->
  <rect x="284" y="0" width="76" height="220" fill="#2b2d31"/>
  <rect x="284" y="0" width="1" height="220" fill="#1e1f22"/>
  <rect x="290" y="6" width="30" height="12" rx="4" fill="#404249"/>
  <text x="295" y="15" font-family="sans-serif" font-size="6" fill="#dbdee1">Files</text>
  <rect x="324" y="6" width="34" height="12" rx="4" fill="#232428"/>
  <text x="329" y="15" font-family="sans-serif" font-size="6" fill="#949ba4">Changes</text>
  <rect x="290" y="26" width="10" height="5" rx="2" fill="#6d6f78"/>
  <rect x="306" y="26" width="34" height="5" rx="2" fill="#4e5058"/>
  <rect x="292" y="38" width="8" height="5" rx="2" fill="#6d6f78"/>
  <rect x="306" y="38" width="26" height="5" rx="2" fill="#4e5058"/>
  <rect x="292" y="50" width="8" height="5" rx="2" fill="#6d6f78"/>
  <rect x="306" y="50" width="30" height="5" rx="2" fill="#4e5058"/>
  <rect x="292" y="62" width="8" height="5" rx="2" fill="#6d6f78"/>
  <rect x="306" y="62" width="22" height="5" rx="2" fill="#4e5058"/>
</svg>
